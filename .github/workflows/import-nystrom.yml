name: Import SIMAX reproducibility package
on:
  push:
    paths:
      - '.bundle/**'
      - '.github/workflows/import-nystrom.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify research package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          import json
          parts = sorted(Path('.bundle').glob('part*.bin'))
          if len(parts) != 15:
              raise ValueError(f'Expected 15 bundle parts; got {len(parts)}')
          zippath = Path('/tmp/nystrom-reproducibility.zip')
          with zippath.open('wb') as out:
              for part in parts:
                  out.write(part.read_bytes())
          with ZipFile(zippath) as z:
              if z.testzip():
                  raise ValueError('Archive integrity failure')
              z.extractall('.')
          manifest = json.loads(Path('manifest_sha256.json').read_text())
          for name, expected in manifest.items():
              actual = sha256(Path(name).read_bytes()).hexdigest()
              if actual != expected:
                  raise ValueError(f'SHA-256 mismatch for {name}')
          print(f'Verified {len(manifest)} study files')
          for part in parts: part.unlink()
          Path('.bundle').rmdir()
          Path('.github/workflows/import-nystrom.yml').unlink()
          Path('.github/workflows').rmdir()
          Path('.github').rmdir()
          PY
      - name: Publish code and outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish verified Nyström trace reproducibility files"
          git push
